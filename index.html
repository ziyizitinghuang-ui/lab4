<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Make Your Drink</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main>

    <h1>Make Your Drink</h1>

    <p class="intro">
      Choose what kind of drink you feel like having.
    </p>


    <section class="choice-step">

      <h2>Hot or iced?</h2>

      <div class="options">

        <div class="option">
          <img src="images/hot.png" alt="Hot drink">
          <p>Hot</p>
        </div>

        <div class="option">
          <img src="images/ice.png" alt="Iced drink">
          <p>Iced</p>
        </div>

      </div>

    </section>


    <section class="choice-step">

      <h2>Creamy or light?</h2>

      <div class="options">

        <div class="option">
          <img src="images/creamy.png" alt="Creamy drink">
          <p>Creamy</p>
        </div>

        <div class="option">
          <img src="images/light.png" alt="Light drink">
          <p>Light</p>
        </div>

      </div>

    </section>


    <section class="choice-step">

      <h2>Coffee or tea?</h2>

      <div class="options">

        <div class="option">
          <img src="images/coffee.png" alt="Coffee">
          <p>Coffee</p>
        </div>

        <div class="option">
          <img src="images/tea.png" alt="Tea">
          <p>Tea</p>
        </div>

      </div>

    </section>

  </main>

</body>

</html>
